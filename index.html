<!doctype html>

<html>
    <head>

        <title>title</title>
        <meta charset="UTF-8">

    </head>

    <body>
        <header>
            <button class="top_bt" data-lt="lang_button" onclick="changeLang()">lang</button>
        </header>
    </body>
</html>








<script>
    
    var lang = new URLSearchParams(window.location.search).get("lang");
    lang_data = "";
    async function LoadLang()
    {
        path = "lang/pl.json"
        switch (lang)
        {
            case "en": path = "lang/en.json"; break;
            case "pl": path = "lang/pl.json"; break;
            default: lang = "pl"; path = "lang/pl.json";
        }

        response = await fetch(path);
        if (!response.ok) throw new Error(response.status);
        lang_data = await response.json();

        // setup
        //console.log(lang_data)
        document.title = lang_data['title']

        document.querySelectorAll('[data-lt]').forEach(e => {
            e.innerHTML = lang_data[e.getAttribute('data-lt')];
        });
    } 

    LoadLang();


    function changeLang() {
        if (lang == "pl") lang = "en";
        else lang = "pl";

        console.log(`lang set to ${lang}`)
        LoadLang();
    }

</script>


<style>

    /* top */

    header {
        width: 100%;
        height: 125px;
        text-align: center;
        background-color: rgb(167, 167, 167);
    }

    button.top_bt {
        width: 15%;
        height: 35px;
        background-color: gray;
        border: none;
    }

    button.top_bt:hover {
        background-image: linear-gradient(gray 40%,rgb(196, 196, 196));
        color: white;
    }

    /* other */


</style>
