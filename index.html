<!doctype html>

<html>
    <head>

        <title>title</title>
        <meta charset="UTF-8">

    </head>

    <body>
        <header>
            <button class="top_bt" onclick="changeLang()">
                <font data-lt="lang_button"></font>
                <img id="lang_bt_img" width="16" height="16">
            </button>
        </header>
    </body>
</html>








<script>
    
    lang = new URLSearchParams(window.location.search).get("lang");
    lang_data = "";

    async function LoadLang()
    {
        path = "lang/pl.json"
        switch (lang)
        {
            case "en": path = "lang/en.json"; break;
            case "pl": path = "lang/pl.json"; break;
            default: lang = "pl"; path = "lang/pl.json";
        }

        response = await fetch(path);
        if (!response.ok) throw new Error(response.status);
        lang_data = await response.json();

        // setup
        //console.log(lang_data)
        document.title = lang_data['title']

        document.querySelectorAll('[data-lt]').forEach(e => {
            e.innerHTML = lang_data[e.getAttribute('data-lt')];
        });

        document.getElementById("lang_bt_img").src = "lang/" + lang_data["nlang"] + ".png"; 
    } 

    LoadLang();


    function changeLang() {
        if (lang == "pl") lang = "en";
        else lang = "pl";

        console.log(`lang set to ${lang}`);

        params = new URLSearchParams(window.location.search);
        if (!params.has("lang")) params.append("lang",lang)
        else params.set("lang",lang);
        window.history.pushState({}, "", "?" + params.toString());

        LoadLang();
    }

</script>


<style>

    @font-face {
        font-family: 'Terminal F4';
        src: url('font/Terminal F4.ttf');
    }


    /* other */

    body {
        font-family: 'Terminal F4';
        background-color: gray;
    }

    #lang_bt_img {
        float: right;
    }

    /* top */

    header {
        width: 100%;
        height: 125px;
        text-align: center;
        background-color: rgb(167, 167, 167);
    }

    button.top_bt {
        width: 250px;
        height: 35px;
        background-color: rgb(255, 100, 65);
        border: 2px black solid;
        font-family: 'Terminal F4';
        transition-duration: 0.2s;
    }

    button.top_bt:hover {
        background-color: rgb(175, 25, 0);
        color: white;
        border: 2px white solid;
    }


</style>
