<!doctype html>

<html>
    <head>

        <title>title</title>
        <link rel="icon" type="image/x-icon" href="images/favicon.ico">
        <meta charset="UTF-8">

    </head>

    <body>
        <header>
            <img class="top_logo" src="images/logo-crop.png">
            <div class="top_buttons">

                <button id="top_bt">
                    <font data-lt="test-text"></font>
                </button>
            </div>
        </header>
        <button id="top_bt" class="lang_bt" onclick="changeLang()">
            <img id="lang_bt_img" width="20" height="20">
            <font data-lt="lang_button"></font>
        </button>
        <line>
    </body>
</html>








<script>
    
    lang = new URLSearchParams(window.location.search).get("lang");
    lang_data = "";

    async function LoadLang()
    {
        path = "lang/pl.json"
        switch (lang)
        {
            case "en": path = "lang/en.json"; break;
            case "pl": path = "lang/pl.json"; break;
            default: lang = "pl"; path = "lang/pl.json";
        }

        response = await fetch(path + "?nocache=" + Date.now());
        if (!response.ok) throw new Error(response.status);
        lang_data = await response.json();

        // setup
        //console.log(lang_data)
        document.title = lang_data['title']

        document.querySelectorAll('[data-lt]').forEach(e => {
            e.innerHTML = lang_data[e.getAttribute('data-lt')];
        });

        document.getElementById("lang_bt_img").src = "lang/" + lang_data["lang_button_flag"] + ".png"; 
    } 
    function changeLang() {
        if (lang == "pl") lang = "en";
        else lang = "pl";

        console.log(`lang set to ${lang}`);

        params = new URLSearchParams(window.location.search);
        if (!params.has("lang")) params.append("lang",lang)
        else params.set("lang",lang);
        window.history.pushState({}, "", "?" + params.toString());

        LoadLang();
    }


    LoadLang();

</script>


<style>

    @font-face {
        font-family: 'Terminal F4';
        src: url('font/Terminal F4.ttf');
    }


    /* other */

    body {
        font-family: 'Terminal F4';
        background-color: rgb(22, 22, 22);
        
    }

    line {
        float: left;
        width: 100%;
        height: 2px;
        background-color: gray;
    }

    /* top */

    header {
        width: 100%;
        height: 125px;
        padding: 2px;

        background-color: black;

        display: flex;

        align-items: center;
    }

    header .top_logo {
        height: 100%;

    }

    header .top_buttons {
        height: 100%;
        width: 100%;

        display: flex;
        justify-content: center;

    /* buttons */

    #top_bt {
        display: flex;

        justify-content: space-between;
        align-items: center;

        width: 250px;
        height: 35px;

        background-color: black;
        color: white;
        border: 2px white solid;
        font-family: 'Terminal F4';

    #top_bt:hover {

    #top_bt.lang_bt {

    }


</style>
